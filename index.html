<head>

  <title>Muichiro Impact — Minecraft Builder, Lore Architect &amp; Thumbnail Designer</title>
  <meta name="description" content="Official portfolio of Muichiro Impact (muichiroimpact009) — Custom Minecraft Megabuilds, SMP Lore Worlds, and High-CTR Gaming &amp; Valorant Live Thumbnails." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Space Grotesk', 'Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          colors: {
            mist: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              200: '#99f6e4',
              300: '#5eead4',
              400: '#2dd4bf',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              800: '#115e59',
              900: '#134e4a',
              950: '#042f2e'
            },
            void: {
              950: '#05090d',
              900: '#091118',
              850: '#0d1822',
              800: '#122230',
              700: '#1b3144'
            }
          }
        }
      }
    };
  </script>
  <style>
    :root {
      --bg-primary: #060b10;
      --bg-card: rgba(13, 24, 34, 0.78);
      --border-mist: rgba(94, 234, 212, 0.22);
      --glow-mist: rgba(45, 212, 191, 0.28);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    body.light-mist {
      --bg-primary: #f0f7f7;
      --bg-card: rgba(255, 255, 255, 0.88);
      --border-mist: rgba(13, 148, 136, 0.28);
      --glow-mist: rgba(20, 184, 166, 0.18);
      --text-main: #0f172a;
      --text-muted: #475569;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: 'Inter', system-ui, sans-serif;
      overflow-x: hidden;
      transition: background-color 0.35s ease, color 0.35s ease;
    }

    /* Ambient Mist Grid & Backdrop */
    .mist-grid-bg {
      background-image:
        radial-gradient(circle at 18% 12%, rgba(45, 212, 191, 0.14), transparent 38%),
        radial-gradient(circle at 84% 22%, rgba(192, 132, 252, 0.12), transparent 36%),
        radial-gradient(circle at 50% 85%, rgba(56, 189, 248, 0.10), transparent 45%),
        linear-gradient(to right, rgba(94, 234, 212, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(94, 234, 212, 0.04) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 44px 44px, 44px 44px;
    }

    .glass-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-mist);
      box-shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.55), 0 0 24px -8px var(--glow-mist);
    }

    .glass-card-hover {
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.28s ease, box-shadow 0.28s ease;
    }
    .glass-card-hover:hover {
      transform: translateY(-5px);
      border-color: rgba(94, 234, 212, 0.55);
      box-shadow: 0 22px 48px -12px rgba(0, 0, 0, 0.65), 0 0 32px -4px rgba(45, 212, 191, 0.32);
    }

    /* Floating animation for Muichiro mascot */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(1deg); }
    }
    .animate-float {
      animation: floatSlow 5.5s ease-in-out infinite;
    }

    @keyframes pulseHalo {
      0%, 100% { opacity: 0.45; transform: scale(0.96); }
      50% { opacity: 0.8; transform: scale(1.04); }
    }
    .animate-halo {
      animation: pulseHalo 4.5s ease-in-out infinite;
    }

    /* Vexie.art inspired Marquee Ribbon */
    @keyframes marqueeLeft {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }
    @keyframes marqueeRight {
      0% { transform: translateX(-50%); }
      100% { transform: translateX(0%); }
    }
    .marquee-track-left {
      display: flex;
      width: max-content;
      animation: marqueeLeft 28s linear infinite;
    }
    .marquee-track-right {
      display: flex;
      width: max-content;
      animation: marqueeRight 32s linear infinite;
    }
    .marquee-wrap:hover .marquee-track-left,
    .marquee-wrap:hover .marquee-track-right {
      animation-play-state: paused;
    }

    /* Watermark overlay pattern (inspired by Vexie.art) */
    .watermark-overlay {
      background-image: repeating-linear-gradient(
        -28deg,
        rgba(255, 255, 255, 0.0) 0px,
        rgba(255, 255, 255, 0.0) 48px,
        rgba(94, 234, 212, 0.09) 48px,
        rgba(94, 234, 212, 0.09) 50px
      );
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #060b10;
    }
    ::-webkit-scrollbar-thumb {
      background: #1b3144;
      border-radius: 9999px;
      border: 2px solid #060b10;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #2dd4bf;
    }

    /* Light mode adjustments for hardcoded dark utility classes */
    body.light-mist .theme-surface {
      background-color: rgba(255, 255, 255, 0.85) !important;
      color: #0f172a !important;
    }
    body.light-mist .theme-text-primary {
      color: #0f172a !important;
    }
    body.light-mist .theme-text-secondary {
      color: #334155 !important;
    }
    body.light-mist .theme-badge {
      background-color: rgba(20, 184, 166, 0.14) !important;
      color: #0f766e !important;
      border-color: rgba(13, 148, 136, 0.35) !important;
    }
  </style>
